<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>КлинВект — онлайн</title><link rel="icon" href="/_gw/icon"><link rel="stylesheet" href="/mobile/online.css?v=2"><script src="/mobile/online.js?v=3" defer></script></head>
<body>
<header><div><strong>КлинВект</strong><span id="onlineUser"></span></div><button id="onlineRefresh" type="button">Обновить</button></header>
<p class="privacy">В облаке — готовые показатели и комментарии. Реестра пациентов и исходных выгрузок здесь нет.</p>
<details id="onlineUploadPanel" hidden><summary>Загрузить обезличенный JSON</summary>
<form id="onlineUploadForm"><p id="onlineUploadHelp"></p><label>Файл из Admin<input id="onlineUploadFile" type="file" accept=".json,application/json" required></label>
<div class="upload-actions"><button id="onlineUploadButton" type="submit">Загрузить отчёты</button><button id="onlineUploadCancel" type="button" hidden>Отмена</button></div>
<progress id="onlineUploadProgress" max="100" value="0" hidden></progress><p id="onlineUploadStatus" role="status"></p></form></details>
<div class="controls"><label>Период<select id="onlinePeriod" disabled></select></label><label>Отчёт<select id="onlineScope" disabled></select></label></div>
<p id="onlineStatus" role="status">Загружаются доступные отчёты…</p>
<iframe id="onlineFrame" title="Отчёт КлинВекта" sandbox="allow-scripts allow-same-origin" hidden></iframe>
</body></html>

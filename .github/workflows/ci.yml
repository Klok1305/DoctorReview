name: Проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v6

      - name: Установить pnpm
        uses: pnpm/action-setup@v6

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить состав репозитория
        run: pnpm run audit:repo

      - name: Запустить тесты
        run: pnpm test

      - name: Проверить воспроизводимый benchmark
        run: pnpm run benchmark:architecture

      - name: Проверить вычисления отчётов вне основного потока
        run: pnpm run benchmark:reports

      - name: Проверить задержку событий в фоновых операциях
        run: pnpm run benchmark:background

      - name: Проверить интерфейс Electron
        run: pnpm run test:smoke

      - name: Проверить PDF
        run: pnpm run test:pdf

      - name: Установить тестовый WebKit
        run: pnpm exec playwright install webkit

      - name: Проверить мобильный WebKit
        run: pnpm run test:webkit

      - name: Показать диагностику Electron
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "tmp/smoke-result.json") {
            Get-Content -LiteralPath "tmp/smoke-result.json" -Raw
          }
          if (Test-Path -LiteralPath "tmp/electron-smoke") {
            Get-ChildItem -LiteralPath "tmp/electron-smoke" -Filter "smoke.log" -File -Recurse |
              ForEach-Object { Get-Content -LiteralPath $_.FullName -Tail 40 }
          }

      - name: Сохранить диагностику сбоя
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-electron-diagnostics
          path: |
            tmp/smoke-result.json
            tmp/electron-smoke/**/smoke.log
            tmp/*.png
          if-no-files-found: ignore
          retention-days: 7
